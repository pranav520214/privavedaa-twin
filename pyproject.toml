[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "transplant-twin"
version = "0.1.0"
description = "Synthetic Bayesian pharmacokinetic research platform; not clinical software"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "numpy==2.2.6", "scipy>=1.14,<2", "PyYAML>=6,<7", "duckdb>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
core = []
bayes = ["pymc>=5.20,<6", "arviz>=0.20,<1"]
ui = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "matplotlib>=3.9,<4"]
medgemma = []
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11", "mypy>=1.14", "httpx>=0.28,<1", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: Bayesian numerical experiments"]

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pymc.*", "pytensor.*", "arviz.*", "scipy.*", "pandas.*", "streamlit.*"]
ignore_missing_imports = true
follow_imports = "skip"
